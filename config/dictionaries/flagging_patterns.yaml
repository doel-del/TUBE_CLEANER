# flagging_patterns.yaml
# Pola regex untuk menandai kalimat/komentar yang berisiko mengandung ASR
# error atau butuh interpretasi tambahan (mis. klaim numerik-teknis, harga).
# Yang cocok TIDAK diubah teksnya - hanya ditandai di field `flags` untuk
# direview/diverifikasi terpisah sebelum dipakai sebagai Claim Evidence.
#
# Tambah aturan baru (bentuk list biasa) cukup tambah key baru di sini -
# tidak perlu ubah kode di cleaners/flagging.py.

numeric_claim:
  # angka + satuan teknis umum - rawan ASR salah tangkap digit/satuan.
  # Grup opsional "derajat" menampung pola "105 derajat Celcius". "celcius"
  # ditambahkan di samping "celsius" karena ejaan ini lazim dipakai penutur
  # Indonesia - ditemukan dari kasus nyata dataset Lucid LD60.
  - '\d+[.,]?\d*\s*(derajat\s+)?(volt|amp|mah|ah|watt|mili|mm|gr|gram|kg|celsius|celcius|rpm|nm|hz|mikrofarad|farad)\b'

truncated_unit_suspect:
  # angka+huruf pendek tanpa spasi (mis. "8A") - pola yang terbukti di kasus
  # nyata sering kehilangan huruf ("8A" seharusnya "8Ah").
  # exclude_if_suffix_in: unit yang SUDAH lengkap tidak boleh ikut ke-flag
  # (mis. "8Ah" itu benar apa adanya) - ditemukan sebagai false positive
  # dari kasus nyata sebelumnya.
  patterns:
    - '\b\d+[A-Za-z]{1,2}\b'
  exclude_if_suffix_in:
    - "ah"     # 8Ah, 4Ah - satuan kapasitas baterai, sudah lengkap
    - "mah"    # 2000mAh - sudah lengkap
    - "mm"
    - "kg"
    - "hz"
    - "nm"
    - "cm"
    - "pk"     # PK (tenaga kuda versi lokal) - sudah lengkap
    - "hp"
    - "gr"
    - "v"      # 12v, 20v, 21v - notasi volt informal, sudah lengkap
    - "w"      # watt - sudah lengkap
    - "an"     # 700an, 900an - imbuhan approksimasi "sekitar", bukan unit

price_mention:
  # angka + akhiran harga gaya Indonesia - eksplisit, aman diflag tanpa
  # syarat tambahan karena akhirannya sendiri sudah jadi konteks harga.
  # (?:an)? menampung imbuhan approksimasi ("jutaan", "ribuan") - tanpa ini
  # \b di akhir gagal match karena "an" nempel langsung tanpa word boundary.
  - '\d+[.,]?\d*\s*(rb|ribu|jt|juta)(?:an)?\b'
  - 'rp\s*\d[\d.,]*'
